<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#48dbfb"/>
      <stop offset="50%" stopColor="#0984e3"/>
      <stop offset="100%" stopColor="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fff275"/>
      <stop offset="50%" stopColor="#f1c40f"/>
      <stop offset="100%" stopColor="#e67e22"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#ffffff" stopOpacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with 3D Depth -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="230" r="190" fill="url(#glowGrad)"/>

  <!-- Golden 3D Crown / Star Emblem -->
  <g transform="translate(0, -10)" filter="url(#shadow)">
    <!-- Magic Toddler Star -->
    <path d="M 256 90 L 295 190 L 405 190 L 318 255 L 350 360 L 256 295 L 162 360 L 194 255 L 107 190 L 217 190 Z" fill="url(#starGrad)" stroke="#d35400" stroke-width="8"/>
    <!-- Specular Highlight -->
    <path d="M 256 120 L 282 195 L 360 195 L 298 240 Z" fill="#ffffff" opacity="0.5"/>
    <!-- Sparkles -->
    <circle cx="140" cy="130" r="14" fill="#ffffff"/>
    <circle cx="380" cy="120" r="18" fill="#ffffff"/>
    <circle cx="390" cy="340" r="12" fill="#ffffff"/>
    <circle cx="120" cy="330" r="16" fill="#ffffff"/>
  </g>

  <!-- Cute Smiling Face on Star -->
  <ellipse cx="225" cy="245" rx="10" ry="14" fill="#2d3436"/>
  <circle cx="222" cy="240" r="4" fill="#ffffff"/>
  <ellipse cx="287" cy="245" rx="10" ry="14" fill="#2d3436"/>
  <circle cx="284" cy="240" r="4" fill="#ffffff"/>
  <!-- Rosy Cheeks -->
  <circle cx="205" cy="265" r="14" fill="#ff7675" opacity="0.5"/>
  <circle cx="307" cy="265" r="14" fill="#ff7675" opacity="0.5"/>
  <!-- Smile -->
  <path d="M 236 265 Q 256 285 276 265" fill="none" stroke="#2d3436" stroke-width="7" stroke-linecap="round"/>

  <!-- Badge Banner -->
  <rect x="64" y="395" width="384" height="68" rx="34" fill="#ffffff" filter="url(#shadow)"/>
  <text x="256" y="442" fill="#0984e3" font-size="34" font-family="'Fredoka', 'Quicksand', sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">TYANNA 🌟</text>
</svg>
